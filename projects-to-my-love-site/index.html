<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050002">
  <title>For You ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <section id="intro" class="screen active">
      <div class="intro-wrap">
        <div class="tiny-heart">♡</div>
        <h1>I made something for you.</h1>
        <button id="openBtn" type="button">open</button>
      </div>
    </section>

    <section id="show" class="screen">
      <canvas id="canvas"></canvas>
      <div id="counter" aria-hidden="true"></div>
    </section>

    <section id="ending" class="screen">
      <div class="ending-wrap">
        <div class="final-heart">♡</div>
        <h2>I love you.</h2>
        <div class="red-heart">♥</div>
        <button id="againBtn" type="button">again</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
